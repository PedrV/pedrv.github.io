short_bio_text_justify: false
short_bio: >-
  <p>
  I am currently a PhD student at the University of Porto <i>(base)</i> and the University of Edinburgh. I am supervised by <a href="https://vab.im/" class="clean-no-highlight-link">Prof. Dr. Viacheslav Borovitskiy</a> and <a href="https://www.dcc.fc.up.pt/~pribeiro/" class="clean-no-highlight-link">Prof. Dr. Pedro Ribeiro</a>. 
  <br>
  I am a member of <a href="https://vab.im/" class="clean-no-highlight-link">Prof. Dr. Viacheslav Borovitskiy's</a> research group, <a href="https://vab.im/group/" class="clean-link"><span class="txt-gl">GL</span><span class="txt-u">U</span><span class="txt-ed">Ed</span></a>. If you are interested in joining us, we occasionally have open positions!
  </p>

  <p>
  My main research interests are <i><b>geometric deep learning</b></i> and <i><b>uncertainty quantification</b></i>. I am also interested in <i>network science</i> and <i>topological deep learning</i>.
  </p>

  <p>
  Prior to starting my PhD, I was a Master's student at the University of Porto under the supervision of <a href="https://www.dcc.fc.up.pt/~pribeiro/" class="clean-no-highlight-link">Prof. Dr. Pedro Ribeiro</a> and <a href="https://scholar.google.com/citations?user=ACYwI1cAAAAJ&hl=en" class="clean-no-highlight-link">Dr. Miguel E. P. Silva</a>. I also gained research experience working with several distinguished researchers such as <a href="https://scholar.google.com/citations?user=jjoTZfoAAAAJ&hl=en" class="clean-no-highlight-link">Prof. Dr. João Gama</a> through research internships and participation in a summer school.
  </p>

  <button class="bio-toggle" onclick="toggleBio()">
    <span class="bio-toggle-icon">></span> What led me to Machine-Learning?
  </button>
  <div id="bio-collapsible" style="display:none;">
    <p>
    I initially started with a strong interest in both theoretical and practical computer science, which later expanded to include network science and graph theory. Over time, however, I found my "academic home" in machine learning.
    My transition towards machine learning began during the second year of my bachelor's degree, largely inspired by two books: <a href="https://aima.cs.berkeley.edu/" class="clean-no-highlight-link">Artificial Intelligence: A Modern Approach</a> by Stuart Russell and Peter Norvig and <a href="https://amlbook.com/" class="clean-no-highlight-link">Learning from Data</a> by Yaser S. Abu-Mostafa, Malik Magdon-Ismail and Hsuan-Tien Lin.
    During this transitional phase, I became particularly interested in nature-inspired machine learning algorithms for graph data, alongside learning theory — interests that helped shape my current focus.
    </p>
  </div>

